[project]
name = "eval-harness"
version = "0.1.0"
description = "Regression tests for LLM apps and agents: test sets as files, deterministic and model-graded checks, a baseline gate for CI, cost and latency tracking."
readme = "README.md"
license = "MIT"
authors = [{ name = "Vantion Labs", email = "hello@vantion.co" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "jsonschema>=4.23",
    "pydantic>=2.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.6"]
openai = ["openai>=3.14"]
langfuse = ["langfuse>=4.15"]

[project.scripts]
evals = "eval_harness.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.12",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_harness"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "examples"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
